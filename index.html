<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & Script Protector</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-12">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-extrabold tracking-tight text-blue-400">HTML Script Protector</h1>
            <p class="text-slate-400 mt-1">Shrink, scramble, and protect your HTML code and internal script tags.</p>
        </div>

        <!-- Input Area -->
        <div class="space-y-2">
            <label class="block text-sm font-semibold text-slate-300">Paste your raw HTML code here:</label>
            <textarea id="inputCode" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-4 font-mono text-sm text-cyan-300 focus:outline-none focus:border-blue-500" placeholder="<!DOCTYPE html>&#10;<html>&#10;<body>&#10;  <script>&#10;    console.log('Secret logic');&#10;  </script>&#10;</body>&#10;</html>"></textarea>
        </div>

        <!-- Action Button -->
        <div>
            <button onclick="protectCode()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-lg shadow-lg transition duration-200 w-full md:w-auto">
                Protect & Encrypt Scripts
            </button>
        </div>

        <!-- Output Area -->
        <div class="space-y-2">
            <div class="flex justify-between items-center">
                <label class="block text-sm font-semibold text-slate-300">Protected Output:</label>
                <button onclick="copyOutput()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1 rounded border border-slate-700 transition">Copy Code</button>
            </div>
            <textarea id="outputCode" rows="8" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg p-4 font-mono text-sm text-emerald-400 focus:outline-none" placeholder="Protected output will appear here..."></textarea>
        </div>

    </div>

    <script>
        function protectCode() {
            let html = document.getElementById('inputCode').value;
            
            if (!html.trim()) {
                alert('Please enter some HTML code first!');
                return;
            }

            // Safe regex matching for script tags
            let scriptRegex = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
            let scriptFound = false;

            let protectedHtml = html.replace(scriptRegex, (match, jsCode) => {
                if (!jsCode.trim()) return match;
                scriptFound = true;

                // 1. Minify/Shrink the JS code
                let minified = jsCode
                    .replace(/\/\*[\s\S]*?\*\/|([^:])\/\/.*/g, '$1') 
                    .replace(/\s+/g, ' ') 
                    .trim();

                // 2. Encode payload
                let encoded = btoa(encodeURIComponent(minified));

                // 3. Generate wrapper using safe string concatenation to avoid parser bugs
                let closeTag = '</' + 'script>';
                let wrapper = '<script>\n(function(p){\n    try {\n        var d = decodeURIComponent(atob(p));\n        var s = document.createElement("script");\n        s.text = d;\n        document.head.appendChild(s);\n    } catch(e) { console.error("Execution error"); }\n})("' + encoded + '");\n' + closeTag;

                return wrapper;
            });

            if (!scriptFound) {
                alert('Notice: No script tags were found in your text!');
            } else {
                alert('Success! Scripts protected and encrypted.');
            }

            document.getElementById('outputCode').value = protectedHtml;
        }

        function copyOutput() {
            let outputBox = document.getElementById('outputCode');
            if (!outputBox.value.trim()) {
                alert('Nothing to copy yet!');
                return;
            }
            navigator.clipboard.writeText(outputBox.value).then(() => {
                alert('Protected code copied to clipboard!');
            }).catch(err => {
                outputBox.select();
                document.execCommand('copy');
                alert('Protected code copied to clipboard!');
            });
        }
    </script>
</body>
</html>
