<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Page HTML Packer & Obfuscator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-12">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-extrabold tracking-tight text-blue-400">Full-Page HTML Packer</h1>
            <p class="text-slate-400 mt-1">Converts your entire HTML page into an encrypted payload (Hides all raw HTML from "View Source").</p>
        </div>

        <!-- Input Area -->
        <div class="space-y-2">
            <label class="block text-sm font-semibold text-slate-300">Paste your complete HTML file code here:</label>
            <textarea id="inputCode" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-4 font-mono text-sm text-cyan-300 focus:outline-none focus:border-blue-500" placeholder="<!DOCTYPE html>&#10;<html>&#10;<head><title>My App</title></head>&#10;<body>&#10;  <h1>Hello World</h1>&#10;  <script>console.log('Secret');</script>&#10;</body>&#10;</html>"></textarea>
        </div>

        <!-- Action Button -->
        <div>
            <button onclick="packFullHtml()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-lg shadow-lg transition duration-200 w-full md:w-auto">
                Pack & Obfuscate Full HTML
            </button>
        </div>

        <!-- Output Area -->
        <div class="space-y-2">
            <div class="flex justify-between items-center">
                <label class="block text-sm font-semibold text-slate-300">Protected Output File Code:</label>
                <button onclick="copyOutput()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1 rounded border border-slate-700 transition">Copy Code</button>
            </div>
            <textarea id="outputCode" rows="8" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg p-4 font-mono text-sm text-emerald-400 focus:outline-none" placeholder="Protected output will appear here..."></textarea>
        </div>

    </div>

    <!-- Packer Engine Logic -->
    <script>
        function packFullHtml() {
            let fullHtml = document.getElementById('inputCode').value;
            
            if (!fullHtml.trim()) {
                alert('Please enter complete HTML code first!');
                return;
            }

            // 1. Encode the entire HTML structure securely
            let encoded = btoa(encodeURIComponent(fullHtml));

            // 2. Generate the document-writing wrapper template
            let closeTag = '</' + 'script>';
            let packedOutput = '<!DOCTYPE html>\n' +
                '<html>\n' +
                '<head>\n' +
                '    <meta charset="UTF-8">\n' +
                '    <title>Protected Page</title>\n' +
                '</head>\n' +
                '<body>\n' +
                '<script>\n' +
                '(function(p){\n' +
                '    try {\n' +
                '        var html = decodeURIComponent(atob(p));\n' +
                '        document.open();\n' +
                '        document.write(html);\n' +
                '        document.close();\n' +
                '    } catch(e) { console.error("Loading error", e); }\n' +
                '})("' + encoded + '");\n' +
                closeTag + '\n' +
                '</body>\n' +
                '</html>';

            document.getElementById('outputCode').value = packedOutput;
            alert('Success! Full HTML has been packed and obfuscated.');
        }

        function copyOutput() {
            let outputBox = document.getElementById('outputCode');
            if (!outputBox.value.trim()) {
                alert('Nothing to copy yet!');
                return;
            }
            navigator.clipboard.writeText(outputBox.value).then(() => {
                alert('Packed code copied to clipboard!');
            }).catch(err => {
                outputBox.select();
                document.execCommand('copy');
                alert('Packed code copied to clipboard!');
            });
        }
    </script>
</body>
</html>
