<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced HTML Obfuscator & Packer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-12">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-extrabold tracking-tight text-blue-400">Advanced HTML Obfuscator</h1>
            <p class="text-slate-400 mt-1">Pack full HTML, encrypt code, and strip scripts/comments from the Elements tab.</p>
        </div>

        <!-- Input Area -->
        <div class="space-y-2">
            <label class="block text-sm font-semibold text-slate-300">Paste your complete HTML file code here:</label>
            <textarea id="inputCode" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-4 font-mono text-sm text-cyan-300 focus:outline-none focus:border-blue-500" placeholder="<!DOCTYPE html>&#10;<html>&#10;<head><title>My App</title></head>&#10;<body>&#10;  <h1>Hello World</h1>&#10;  <!-- Secret comment -->&#10;  <script>console.log('Stealth script');</script>&#10;</body>&#10;</html>"></textarea>
        </div>

        <!-- Obfuscation Options (Matching PHPKobo style) -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-lg space-y-3">
            <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Obfuscation Options</h3>
            
            <label class="flex items-center space-x-3 cursor-pointer">
                <input type="checkbox" id="removeScripts" checked class="w-4 h-4 text-blue-600 rounded bg-slate-800 border-slate-700 focus:ring-blue-500">
                <span class="text-sm text-slate-300">Remove all script blocks (&lt;script&gt;...&lt;/script&gt;) from the Elements tab in DevTools</span>
            </label>

            <label class="flex items-center space-x-3 cursor-pointer">
                <input type="checkbox" id="removeComments" checked class="w-4 h-4 text-blue-600 rounded bg-slate-800 border-slate-700 focus:ring-blue-500">
                <span class="text-sm text-slate-300">Remove all comment blocks (&lt;!--...--&gt;) from the Elements tab in DevTools</span>
            </label>
        </div>

        <!-- Action Button -->
        <div>
            <button onclick="packAndObfuscate()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-lg shadow-lg transition duration-200 w-full md:w-auto">
                Obfuscate & Pack HTML
            </button>
        </div>

        <!-- Output Area -->
        <div class="space-y-2">
            <div class="flex justify-between items-center">
                <label class="block text-sm font-semibold text-slate-300">Protected Output Code:</label>
                <button onclick="copyOutput()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1 rounded border border-slate-700 transition">Copy Code</button>
            </div>
            <textarea id="outputCode" rows="8" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg p-4 font-mono text-sm text-emerald-400 focus:outline-none" placeholder="Protected output will appear here..."></textarea>
        </div>

    </div>

    <!-- Advanced Packer & Stripper Engine -->
    <script>
        function packAndObfuscate() {
            let html = document.getElementById('inputCode').value;
            
            if (!html.trim()) {
                alert('Please enter complete HTML code first!');
                return;
            }

            let shouldRemoveComments = document.getElementById('removeComments').checked;
            let shouldRemoveScripts = document.getElementById('removeScripts').checked;

            // 1. Remove comment blocks if option is checked
            if (shouldRemoveComments) {
                html = html.replace(/<!--[\s\S]*?-->/g, '');
            }

            let extractedScripts = [];

            // 2. Remove script blocks from HTML and store them for memory execution if checked
            if (shouldRemoveScripts) {
                let scriptRegex = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
                html = html.replace(scriptRegex, (match, jsCode) => {
                    if (jsCode.trim()) {
                        extractedScripts.push(jsCode.trim());
                    }
                    return ''; // Completely deletes the <script> tag from the HTML markup!
                });
            }

            // 3. Encode the cleaned HTML payload
            let encodedHtml = btoa(encodeURIComponent(html));
            
            // 4. Encode extracted scripts payload separately
            let encodedScripts = btoa(encodeURIComponent(JSON.stringify(extractedScripts)));

            // 5. Generate the final packing wrapper script
            let closeTag = '</' + 'script>';
            let finalOutput = '<!DOCTYPE html>\n' +
                '<html>\n' +
                '<head>\n' +
                '    <meta charset="UTF-8">\n' +
                '    <title>Protected Page</title>\n' +
                '</head>\n' +
                '<body>\n' +
                '<script>\n' +
                '(function(htmlPayload, scriptPayload){\n' +
                '    try {\n' +
                '        // Write clean HTML (zero script tags or comments in DOM Elements tab)\n' +
                '        var decodedHtml = decodeURIComponent(atob(htmlPayload));\n' +
                '        document.open();\n' +
                '        document.write(decodedHtml);\n' +
                '        document.close();\n\n' +
                '        // Execute scripts in memory via eval\n' +
                '        var scripts = JSON.parse(decodeURIComponent(atob(scriptPayload)));\n' +
                '        scripts.forEach(function(code) {\n' +
                '            eval(code);\n' +
                '        });\n' +
                '    } catch(e) { console.error("Execution error", e); }\n' +
                '})("' + encodedHtml + '", "' + encodedScripts + '");\n' +
                closeTag + '\n' +
                '</body>\n' +
                '</html>';

            document.getElementById('outputCode').value = finalOutput;
            alert('Success! HTML obfuscated and packed with DevTools script/comment stripping enabled.');
        }

        function copyOutput() {
            let outputBox = document.getElementById('outputCode');
            if (!outputBox.value.trim()) {
                alert('Nothing to copy yet!');
                return;
            }
            navigator.clipboard.writeText(outputBox.value).then(() => {
                alert('Protected code copied to clipboard!');
            }).catch(err => {
                outputBox.select();
                document.execCommand('copy');
                alert('Protected code copied to clipboard!');
            });
        }
    </script>
</body>
</html>
